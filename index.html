<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reel Goobers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1a24; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      /* The game draws at 1920x1080 and scales to fit the window, keeping pixels crisp. */
      canvas { image-rendering: pixelated; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; }
    </style>
  </head>
  <body>
    <canvas id="game" width="1920" height="1080"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
